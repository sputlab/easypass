<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="45%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Padlock Body Gradient -->
    <linearGradient id="lockBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Shackle Gradient -->
    <linearGradient id="shackleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3" filter="url(#cardShadow)" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="256" r="160" fill="#2563eb" opacity="0.18" filter="url(#glow)" />

  <!-- Padlock Shackle -->
  <path d="M 184 240 V 176 C 184 136 216 104 256 104 C 296 104 328 136 328 176 V 240" 
        fill="none" 
        stroke="url(#shackleGrad)" 
        stroke-width="32" 
        stroke-linecap="round" />

  <!-- Padlock Body -->
  <rect x="144" y="228" width="224" height="176" rx="36" fill="url(#lockBodyGrad)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="3" filter="url(#glow)" />

  <!-- Digital Passkey Beam / Keyhole -->
  <circle cx="256" cy="296" r="18" fill="#ffffff" />
  <path d="M 248 306 L 244 348 C 244 354 249 360 256 360 C 263 360 268 354 268 348 L 264 306 Z" fill="#ffffff" />

  <!-- Glowing Accent Stars / Dots (Password Dots Motif) -->
  <circle cx="196" cy="306" r="6" fill="#93c5fd" opacity="0.8" />
  <circle cx="316" cy="306" r="6" fill="#93c5fd" opacity="0.8" />
</svg>
