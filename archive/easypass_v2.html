<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyPass - Generatore di Password Sicure</title>
    <style>
        :root {
            --bg: #0c0c1e;
            --card-bg: rgba(18, 18, 32, 0.9);
            --card-border: rgba(255, 255, 255, 0.06);
            --text: #e0e0e0;
            --text-secondary: #a0a0b8;
            --accent: #6c5ce7;
            --accent-hover: #7f6ff0;
            --danger: #e74c3c;
            --warning: #f39c12;
            --success: #2ecc71;
            --info: #3498db;
            /* Colori uniformi per categorie – pastello e consistenti */
            --color-lower: #6ee7b7;
            --color-upper: #7dd3fc;
            --color-digit: #fcd34d;
            --color-special: #f0abfc;
            --input-bg: rgba(255, 255, 255, 0.05);
            --input-border: rgba(255, 255, 255, 0.15);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
            --radius: 18px;
            --radius-sm: 12px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at 30% 20%, rgba(108, 92, 231, 0.08) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 70%, rgba(240, 171, 252, 0.06) 0%, transparent 55%),
                #0c0c1e;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            padding: 20px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 50% 50%, rgba(108, 92, 231, 0.04) 0%, transparent 70%);
            pointer-events: none;
            animation: bgPulse 8s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%,
            100% {
                opacity: 0.4;
            }
            50% {
                opacity: 0.7;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 530px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 32px 28px 24px;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: var(--shadow-lg);
            transition: all var(--transition);
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            margin-bottom: 10px;
            font-size: 24px;
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.4);
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #fff;
            margin-bottom: 2px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Sezione password */
        .password-section {
            margin-bottom: 20px;
        }

        .password-display {
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: var(--radius-sm);
            padding: 8px 8px 8px 18px;
            transition: all var(--transition);
            gap: 8px;
            min-height: 56px;
        }

        .password-display:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.12);
        }

        .password-text {
            flex: 1;
            font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
            font-size: 1.25rem;
            letter-spacing: 0.8px;
            line-height: 1.4;
            word-break: break-all;
            color: #fff;
            background: transparent;
            border: none;
            outline: none;
            transition: color 0.2s;
            user-select: all;
            display: inline-block;
        }

        .password-text.placeholder {
            color: #5a5a6e;
            letter-spacing: 0;
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            font-size: 0.95rem;
            user-select: none;
        }

        /* Caratteri colorati per tipo */
        .password-text .char-lower {
            color: var(--color-lower);
            text-shadow: 0 0 8px rgba(110, 231, 183, 0.3);
        }
        .password-text .char-upper {
            color: var(--color-upper);
            text-shadow: 0 0 8px rgba(125, 211, 252, 0.3);
        }
        .password-text .char-digit {
            color: var(--color-digit);
            text-shadow: 0 0 8px rgba(252, 211, 77, 0.3);
        }
        .password-text .char-special {
            color: var(--color-special);
            text-shadow: 0 0 8px rgba(240, 171, 252, 0.3);
        }

        .btn-copy {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.06);
            color: #ccc;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            position: relative;
        }

        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
        }
        .btn-copy:active {
            transform: scale(0.94);
            background: rgba(255, 255, 255, 0.2);
        }
        .btn-copy.copied {
            background: var(--success);
            color: #fff;
            animation: copyPulse 0.5s ease;
        }

        @keyframes copyPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.13);
            }
        }

        .btn-copy .tooltip-copy {
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%) translateY(6px);
            background: #333;
            color: #fff;
            font-size: 0.68rem;
            padding: 4px 10px;
            border-radius: 6px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: all 0.2s ease;
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
        }

        .btn-copy.copied .tooltip-copy {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            background: var(--success);
        }

        /* Barra complessità */
        .strength-section {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .strength-bar-container {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }

        .strength-bar-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s cubic-bezier(0.25, 0.8, 0.25, 1.2), background-color 0.4s ease;
            width: 0%;
            background: #555;
        }

        .strength-label {
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            min-width: 65px;
            text-align: right;
            transition: color 0.4s ease;
            color: #777;
        }

        .strength-label.level-weak {
            color: var(--danger);
        }
        .strength-label.level-medium {
            color: var(--warning);
        }
        .strength-label.level-strong {
            color: var(--success);
        }
        .strength-label.level-very-strong {
            color: #00e676;
        }

        /* Lunghezza totale */
        .length-section {
            margin-bottom: 22px;
        }

        .length-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .length-header label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #ddd;
        }

        .length-value {
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
            background: rgba(108, 92, 231, 0.22);
            padding: 4px 14px;
            border-radius: 20px;
            min-width: 44px;
            text-align: center;
        }

        .range-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            cursor: pointer;
        }

        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--accent);
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(108, 92, 231, 0.5);
        }
        .range-slider::-moz-range-thumb {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--accent);
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(108, 92, 231, 0.5);
        }

        /* Toggles */
        .toggles-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 8px;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.025);
            border-radius: var(--radius-sm);
            transition: all var(--transition);
            border: 1px solid transparent;
        }

        .toggle-row:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.06);
        }

        /* Riga disattivata: solo aspetto opaco, ma interattiva */
        .toggle-row.disabled-row {
            opacity: 0.45;
            pointer-events: auto; /* assicura che il toggle resti cliccabile */
        }

        .toggle-row .icon-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
            transition: all var(--transition);
            box-shadow: 0 0 10px currentColor;
        }
        .icon-indicator.lower {
            background: var(--color-lower);
            box-shadow: 0 0 10px var(--color-lower);
        }
        .icon-indicator.upper {
            background: var(--color-upper);
            box-shadow: 0 0 10px var(--color-upper);
        }
        .icon-indicator.digit {
            background: var(--color-digit);
            box-shadow: 0 0 10px var(--color-digit);
        }
        .icon-indicator.special {
            background: var(--color-special);
            box-shadow: 0 0 10px var(--color-special);
        }

        .toggle-row .toggle-label-text {
            flex: 1;
            font-size: 0.9rem;
            font-weight: 500;
            color: #ccc;
            user-select: none;
            cursor: pointer;
            transition: color var(--transition);
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 26px;
            flex-shrink: 0;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 30px;
            transition: all var(--transition);
        }

        .toggle-slider::before {
            content: '';
            position: absolute;
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background: #fff;
            border-radius: 50%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .toggle-switch input:checked+.toggle-slider {
            background: var(--accent);
        }
        .toggle-switch input:checked+.toggle-slider::before {
            transform: translateX(22px);
        }

        .mini-number-input {
            width: 52px;
            height: 32px;
            background: var(--input-bg);
            border: 1.5px solid var(--input-border);
            border-radius: 8px;
            color: #fff;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all var(--transition);
            flex-shrink: 0;
            -moz-appearance: textfield;
        }

        .mini-number-input::-webkit-outer-spin-button,
        .mini-number-input::-webkit-inner-spin-button {
            opacity: 0.8;
            height: 28px;
        }

        .mini-number-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
            background: rgba(255, 255, 255, 0.08);
        }

        .mini-number-input:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            background: rgba(255, 255, 255, 0.02);
        }

        .summary-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            padding: 0 4px;
            min-height: 20px;
        }

        .summary-row .remaining {
            font-weight: 600;
        }
        .remaining.ok {
            color: var(--success);
        }
        .remaining.warn {
            color: var(--warning);
        }
        .remaining.error {
            color: var(--danger);
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-4px);
            }
            75% {
                transform: translateX(4px);
            }
        }

        .error-msg {
            font-size: 0.78rem;
            color: var(--danger);
            text-align: center;
            min-height: 20px;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .btn-generate {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--accent), #5a4bd1);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.4px;
            transition: all var(--transition);
            box-shadow: 0 10px 28px rgba(108, 92, 231, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .btn-generate:hover {
            background: linear-gradient(135deg, var(--accent-hover), #6b5ce7);
            box-shadow: 0 14px 36px rgba(108, 92, 231, 0.55);
            transform: translateY(-2px);
        }
        .btn-generate:active {
            transform: scale(0.97);
            box-shadow: 0 4px 14px rgba(108, 92, 231, 0.4);
        }
        .btn-generate:disabled {
            background: #444;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
            opacity: 0.5;
        }

        .spark-icon {
            font-size: 1.2rem;
            transition: transform 0.3s;
        }
        .btn-generate:hover .spark-icon {
            transform: rotate(-15deg) scale(1.2);
        }

        /* Footer */
        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 14px;
            margin-top: 4px;
        }

        .footer span {
            color: #bbb;
            font-weight: 500;
        }

        .footer .heart {
            color: #e056a0;
            margin: 0 3px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 22px 16px;
            }
            .password-text {
                font-size: 1.05rem;
            }
            .toggle-row {
                padding: 8px 10px;
                gap: 6px;
            }
            .toggle-row .toggle-label-text {
                font-size: 0.8rem;
            }
            .mini-number-input {
                width: 44px;
                height: 28px;
                font-size: 0.8rem;
            }
            .toggle-switch {
                width: 42px;
                height: 22px;
            }
            .toggle-slider::before {
                height: 16px;
                width: 16px;
            }
            .toggle-switch input:checked+.toggle-slider::before {
                transform: translateX(18px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="header-icon">🔐</div>
                <h1>EasyPass</h1>
                <p>Genera password robuste e personalizzate</p>
            </div>

            <div class="password-section">
                <div class="password-display" id="passwordDisplayWrapper">
                    <div class="password-text placeholder" id="passwordText">La tua password apparirà qui</div>
                    <button class="btn-copy" id="btnCopy" title="Copia password" disabled>
                        📋
                        <span class="tooltip-copy">Copiato!</span>
                    </button>
                </div>
                <div class="strength-section">
                    <div class="strength-bar-container">
                        <div class="strength-bar-fill" id="strengthBarFill"></div>
                    </div>
                    <span class="strength-label" id="strengthLabel">—</span>
                </div>
            </div>

            <div class="length-section">
                <div class="length-header">
                    <label for="totalLength">Lunghezza totale</label>
                    <span class="length-value" id="lengthValueDisplay">16</span>
                </div>
                <input type="range" class="range-slider" id="totalLength" min="4" max="64" value="16" step="1">
            </div>

            <div class="toggles-section">
                <div class="toggle-row" id="rowLower">
                    <span class="icon-indicator lower"></span>
                    <span class="toggle-label-text">Minuscole (a-z)</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="toggleLower" checked>
                        <span class="toggle-slider"></span>
                    </label>
                    <input type="number" class="mini-number-input" id="countLower" value="4" min="0" max="64">
                </div>
                <div class="toggle-row" id="rowUpper">
                    <span class="icon-indicator upper"></span>
                    <span class="toggle-label-text">Maiuscole (A-Z)</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="toggleUpper" checked>
                        <span class="toggle-slider"></span>
                    </label>
                    <input type="number" class="mini-number-input" id="countUpper" value="3" min="0" max="64">
                </div>
                <div class="toggle-row" id="rowDigit">
                    <span class="icon-indicator digit"></span>
                    <span class="toggle-label-text">Numeri (0-9)</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="toggleDigit" checked>
                        <span class="toggle-slider"></span>
                    </label>
                    <input type="number" class="mini-number-input" id="countDigit" value="3" min="0" max="64">
                </div>
                <div class="toggle-row" id="rowSpecial">
                    <span class="icon-indicator special"></span>
                    <span class="toggle-label-text">Speciali (!@#$...)</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="toggleSpecial" checked>
                        <span class="toggle-slider"></span>
                    </label>
                    <input type="number" class="mini-number-input" id="countSpecial" value="2" min="0" max="64">
                </div>
            </div>

            <div class="summary-row">
                <span id="summaryText">Caratteri casuali extra: 4</span>
                <span class="remaining ok" id="remainingIndicator">✓</span>
            </div>
            <div class="error-msg" id="errorMsg"></div>

            <button class="btn-generate" id="btnGenerate">
                <span class="spark-icon">⚡</span> Genera Password
            </button>

            <div class="footer">
                <span>EasyPass</span> v1.0 • Made with <span class="heart">❤️</span> by <span>sputlab.com</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // Elementi DOM
            const passwordText = document.getElementById('passwordText');
            const btnCopy = document.getElementById('btnCopy');
            const btnGenerate = document.getElementById('btnGenerate');
            const totalLengthSlider = document.getElementById('totalLength');
            const lengthValueDisplay = document.getElementById('lengthValueDisplay');
            const strengthBarFill = document.getElementById('strengthBarFill');
            const strengthLabel = document.getElementById('strengthLabel');
            const errorMsg = document.getElementById('errorMsg');
            const summaryText = document.getElementById('summaryText');
            const remainingIndicator = document.getElementById('remainingIndicator');

            const toggleLower = document.getElementById('toggleLower');
            const toggleUpper = document.getElementById('toggleUpper');
            const toggleDigit = document.getElementById('toggleDigit');
            const toggleSpecial = document.getElementById('toggleSpecial');
            const countLower = document.getElementById('countLower');
            const countUpper = document.getElementById('countUpper');
            const countDigit = document.getElementById('countDigit');
            const countSpecial = document.getElementById('countSpecial');
            const rowLower = document.getElementById('rowLower');
            const rowUpper = document.getElementById('rowUpper');
            const rowDigit = document.getElementById('rowDigit');
            const rowSpecial = document.getElementById('rowSpecial');

            const toggleConfigs = [
                { toggle: toggleLower, count: countLower, row: rowLower, chars: 'abcdefghijklmnopqrstuvwxyz',
                    name: 'minuscole', type: 'lower' },
                { toggle: toggleUpper, count: countUpper, row: rowUpper, chars: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
                    name: 'maiuscole', type: 'upper' },
                { toggle: toggleDigit, count: countDigit, row: rowDigit, chars: '0123456789', name: 'numeri',
                    type: 'digit' },
                { toggle: toggleSpecial, count: countSpecial, row: rowSpecial,
                    chars: '!@#$%^&*()_+-=[]{}|;:,.<>?/~', name: 'speciali', type: 'special' },
            ];

            let currentPassword = '';

            // Utility
            function shuffleArray(arr) {
                const a = [...arr];
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            }

            function getRandomChar(charset) {
                return charset[Math.floor(Math.random() * charset.length)];
            }

            function getCharTypeClass(char) {
                if (/[a-z]/.test(char)) return 'char-lower';
                if (/[A-Z]/.test(char)) return 'char-upper';
                if (/[0-9]/.test(char)) return 'char-digit';
                return 'char-special';
            }

            function colorizePassword(password) {
                if (!password) return '';
                let html = '';
                for (const ch of password) {
                    const cls = getCharTypeClass(ch);
                    html += `<span class="${cls}">${ch}</span>`;
                }
                return html;
            }

            function getActiveConfigs() {
                return toggleConfigs.filter(c => c.toggle.checked);
            }

            function getTotalMinRequired() {
                let sum = 0;
                toggleConfigs.forEach(c => {
                    if (c.toggle.checked) sum += Math.max(0, parseInt(c.count.value) || 0);
                });
                return sum;
            }

            function getTotalLength() {
                return parseInt(totalLengthSlider.value) || 16;
            }

            function validateConfig() {
                const active = getActiveConfigs();
                const totalLen = getTotalLength();
                const totalMin = getTotalMinRequired();
                if (active.length === 0) return { valid: false, msg: 'Seleziona almeno un tipo di carattere.' };
                if (totalMin > totalLen) return { valid: false,
                    msg: `La somma dei minimi (${totalMin}) supera la lunghezza totale (${totalLen}).` };
                for (const c of active) {
                    const val = parseInt(c.count.value) || 0;
                    if (val > totalLen) return { valid: false,
                        msg: `Il valore per "${c.name}" (${val}) supera la lunghezza totale.` };
                }
                return { valid: true, msg: '' };
            }

            function updateUIState() {
                const active = getActiveConfigs();
                const totalLen = getTotalLength();
                const totalMin = getTotalMinRequired();
                const remaining = totalLen - totalMin;
                const validation = validateConfig();

                lengthValueDisplay.textContent = totalLen;

                toggleConfigs.forEach(c => {
                    c.count.disabled = !c.toggle.checked;
                    if (!c.toggle.checked) {
                        c.count.value = 0;
                        c.row.classList.add('disabled-row');
                    } else {
                        c.row.classList.remove('disabled-row');
                        if ((parseInt(c.count.value) || 0) === 0) c.count.value = 1;
                    }
                    let val = parseInt(c.count.value) || 0;
                    val = Math.max(0, Math.min(val, totalLen));
                    c.count.value = val;
                });

                if (active.length === 0) {
                    summaryText.textContent = 'Nessun tipo selezionato';
                    remainingIndicator.textContent = '✗';
                    remainingIndicator.className = 'remaining error';
                } else if (remaining < 0) {
                    summaryText.textContent = `Eccesso di ${Math.abs(remaining)} caratteri!`;
                    remainingIndicator.textContent = '✗';
                    remainingIndicator.className = 'remaining error';
                } else if (remaining === 0) {
                    summaryText.textContent = 'Nessun carattere casuale extra';
                    remainingIndicator.textContent = '✓';
                    remainingIndicator.className = 'remaining ok';
                } else {
                    summaryText.textContent = `Caratteri casuali extra: ${remaining}`;
                    remainingIndicator.textContent = '✓';
                    remainingIndicator.className = 'remaining ok';
                }

                if (!validation.valid) {
                    errorMsg.textContent = validation.msg;
                    btnGenerate.disabled = true;
                } else {
                    errorMsg.textContent = '';
                    btnGenerate.disabled = false;
                }
            }

            function generatePassword() {
                const validation = validateConfig();
                if (!validation.valid) return null;
                const totalLen = getTotalLength();
                const active = getActiveConfigs();
                const totalMin = getTotalMinRequired();
                const remainingSlots = totalLen - totalMin;
                let passwordChars = [];

                active.forEach(c => {
                    const minCount = parseInt(c.count.value) || 0;
                    for (let i = 0; i < minCount; i++) passwordChars.push(getRandomChar(c.chars));
                });

                const combinedCharset = active.map(c => c.chars).join('');
                for (let i = 0; i < remainingSlots; i++) passwordChars.push(getRandomChar(combinedCharset));

                passwordChars = shuffleArray(passwordChars);
                passwordChars = shuffleArray(passwordChars); // doppio mescolamento
                return passwordChars.join('');
            }

            function displayPassword(password) {
                currentPassword = password;
                passwordText.innerHTML = colorizePassword(password);
                passwordText.classList.remove('placeholder');
                btnCopy.disabled = false;
                updateStrengthIndicator(password);
            }

            function clearPassword() {
                currentPassword = '';
                passwordText.textContent = 'La tua password apparirà qui';
                passwordText.classList.add('placeholder');
                btnCopy.disabled = true;
                btnCopy.classList.remove('copied');
                btnCopy.innerHTML = '📋<span class="tooltip-copy">Copiato!</span>';
                strengthBarFill.style.width = '0%';
                strengthBarFill.style.backgroundColor = '#555';
                strengthLabel.textContent = '—';
                strengthLabel.className = 'strength-label';
            }

            function updateStrengthIndicator(password) {
                if (!password) {
                    strengthBarFill.style.width = '0%';
                    strengthBarFill.style.backgroundColor = '#555';
                    strengthLabel.textContent = '—';
                    strengthLabel.className = 'strength-label';
                    return;
                }
                const length = password.length;
                const hasLower = /[a-z]/.test(password);
                const hasUpper = /[A-Z]/.test(password);
                const hasDigit = /\d/.test(password);
                const hasSpecial = /[^a-zA-Z0-9]/.test(password);
                const typesUsed = [hasLower, hasUpper, hasDigit, hasSpecial].filter(Boolean).length;

                let lengthScore = Math.min(length / 20, 1) * 50;
                if (length < 8) lengthScore = Math.min(lengthScore, 25);
                if (length < 6) lengthScore = Math.min(lengthScore, 10);
                const varietyScore = (typesUsed / 4) * 50;
                let bonus = 0;
                if (length >= 16 && typesUsed === 4) bonus = 15;
                if (length >= 20 && typesUsed === 4) bonus = 20;
                let totalScore = Math.min(lengthScore + varietyScore + bonus, 100);

                let level, color, labelText;
                if (totalScore < 30) { level = 'weak';
                    color = '#e74c3c';
                    labelText = 'Debole'; } else if (totalScore < 55) { level = 'medium';
                    color = '#f39c12';
                    labelText = 'Media'; } else if (totalScore < 80) { level = 'strong';
                    color = '#2ecc71';
                    labelText = 'Forte'; } else { level = 'very-strong';
                    color = '#00e676';
                    labelText = 'Molto forte'; }

                strengthBarFill.style.width = totalScore + '%';
                strengthBarFill.style.backgroundColor = color;
                strengthLabel.textContent = labelText;
                strengthLabel.className = 'strength-label level-' + level;
            }

            function handleGenerate() {
                updateUIState();
                const validation = validateConfig();
                if (!validation.valid) {
                    clearPassword();
                    btnGenerate.style.animation = 'none';
                    btnGenerate.offsetHeight;
                    btnGenerate.style.animation = 'shake 0.5s ease';
                    setTimeout(() => { btnGenerate.style.animation = ''; }, 500);
                    return;
                }
                const password = generatePassword();
                if (password) {
                    displayPassword(password);
                    const wrapper = document.getElementById('passwordDisplayWrapper');
                    wrapper.style.borderColor = 'var(--success)';
                    wrapper.style.boxShadow = '0 0 0 4px rgba(46, 204, 113, 0.2)';
                    setTimeout(() => {
                        wrapper.style.borderColor = 'var(--input-border)';
                        wrapper.style.boxShadow = '';
                    }, 600);
                }
            }

            async function handleCopy() {
                if (!currentPassword) return;
                try {
                    await navigator.clipboard.writeText(currentPassword);
                    btnCopy.classList.add('copied');
                    btnCopy.innerHTML = '✅<span class="tooltip-copy">Copiato!</span>';
                    setTimeout(() => {
                        btnCopy.classList.remove('copied');
                        btnCopy.innerHTML = '📋<span class="tooltip-copy">Copiato!</span>';
                    }, 2000);
                } catch (err) {
                    const textArea = document.createElement('textarea');
                    textArea.value = currentPassword;
                    textArea.style.position = 'fixed';
                    textArea.style.left = '-9999px';
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        btnCopy.classList.add('copied');
                        btnCopy.innerHTML = '✅<span class="tooltip-copy">Copiato!</span>';
                        setTimeout(() => {
                            btnCopy.classList.remove('copied');
                            btnCopy.innerHTML = '📋<span class="tooltip-copy">Copiato!</span>';
                        }, 2000);
                    } catch (e) {
                        alert('Copia manuale necessaria.');
                    }
                    document.body.removeChild(textArea);
                }
            }

            // Event listeners
            totalLengthSlider.addEventListener('input', () => {
                updateUIState();
                if (currentPassword && validateConfig().valid) {
                    const pw = generatePassword();
                    if (pw) displayPassword(pw);
                } else if (!validateConfig().valid) clearPassword();
            });

            toggleConfigs.forEach(c => {
                c.toggle.addEventListener('change', () => {
                    updateUIState();
                    if (currentPassword && validateConfig().valid) {
                        const pw = generatePassword();
                        if (pw) displayPassword(pw);
                    } else if (!validateConfig().valid) clearPassword();
                });

                c.count.addEventListener('input', () => {
                    let val = parseInt(c.count.value);
                    if (isNaN(val) || val < 0) c.count.value = 0;
                    val = parseInt(c.count.value);
                    const totalLen = getTotalLength();
                    if (val > totalLen) c.count.value = totalLen;
                    updateUIState();
                    if (currentPassword && validateConfig().valid) {
                        const pw = generatePassword();
                        if (pw) displayPassword(pw);
                    } else if (!validateConfig().valid) clearPassword();
                });

                c.count.addEventListener('blur', () => {
                    if (c.count.value === '' || parseInt(c.count.value) < 0) {
                        c.count.value = c.toggle.checked ? 1 : 0;
                    }
                    updateUIState();
                });
            });

            btnGenerate.addEventListener('click', handleGenerate);
            btnCopy.addEventListener('click', handleCopy);

            passwordText.addEventListener('click', () => {
                if (currentPassword) {
                    const range = document.createRange();
                    range.selectNodeContents(passwordText);
                    const selection = window.getSelection();
                    selection.removeAllRanges();
                    selection.addRange(range);
                }
            });

            // Inizializzazione
            updateUIState();
            const initialPw = generatePassword();
            if (initialPw) displayPassword(initialPw);
        })();
    </script>
</body>
</html>
